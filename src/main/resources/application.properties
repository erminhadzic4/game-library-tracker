spring.application.name=game-library-tracker-backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/gametracker
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# Never include stack traces in error responses (DevTools turns them on for local runs otherwise)
spring.web.error.include-stacktrace=never

# JWT: the secret is a Base64-encoded key of at least 256 bits and must come from JWT_SECRET; there is no real default.
# The empty fallback turns a missing variable into an empty value, which JwtProperties (@NotBlank) rejects at startup
# with a readable "APPLICATION FAILED TO START" message
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# RAWG API (https://rawg.io/apidocs); the key must come from RAWG_API_KEY and has no real default.
# Same pattern as jwt.secret: the empty fallback is rejected by RawgProperties (@NotBlank) with a readable startup report
rawg.base-url=https://api.rawg.io/api
rawg.api-key=${RAWG_API_KEY:}