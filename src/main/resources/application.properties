spring.application.name=game-library-tracker-backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/gametracker
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# Never include stack traces in error responses (DevTools turns them on for local runs otherwise)
spring.web.error.include-stacktrace=never

# JWT (secret is a Base64-encoded key of at least 256 bits; override with JWT_SECRET outside local dev)
jwt.secret=${JWT_SECRET:D7v/dRQXJLeDRkoa1iUGtFmAKHq1y/na3yzBdH+HEl4=}
jwt.expiration-ms=86400000

# RAWG API (https://rawg.io/apidocs); the key has no default, so RAWG_API_KEY must be set or startup fails
rawg.base-url=https://api.rawg.io/api
rawg.api-key=${RAWG_API_KEY}