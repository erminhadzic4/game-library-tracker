# Loaded on top of application.properties by @ActiveProfiles("test")

# In-memory H2 instead of Postgres; the schema is created fresh for each test run
spring.datasource.url=jdbc:h2:mem:gametracker;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy key so the context starts without RAWG_API_KEY; no test calls RAWG
rawg.api-key=test-key

# Test-only JWT signing key (random, 256 bits) so the context starts without JWT_SECRET; never use it outside tests
jwt.secret=opeWRAYiDYf2L+h7QNfTxCCzjD7Oo8KqDPqTxVLezsc=
